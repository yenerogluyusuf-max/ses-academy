# Weiterleitung wie bei Supabase. Die Schlüssel sind JWTs; Auth, PostgREST und Storage prüfen sie selbst.
# Kong lauscht nur auf 127.0.0.1 und wird nur vom Next.js-Server auf demselben Rechner angesprochen.
_format_version: "1.1"
services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: [/auth/v1/]
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
